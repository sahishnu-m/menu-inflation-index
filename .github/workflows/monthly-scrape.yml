# Monthly price collection.
#
# WHY GITHUB ACTIONS RATHER THAN CRON
# A cron job needs a machine that is switched on at the scheduled moment. A
# laptop that happens to be closed on the 1st silently skips that month, and a
# price index with a hole in it cannot be repaired later, because menu prices
# from a month ago are gone. Actions runs on GitHub's machines, so the schedule
# holds whatever your laptop is doing.
#
# It also commits the updated database straight back to the repository, which
# is what the deployed dashboard reads. One run therefore collects the prices
# and publishes them.
#
# HOW TO TURN THIS ON
# It runs automatically once pushed, but GitHub disables scheduled workflows on
# repositories with no activity for 60 days, and emails you when that happens.
# Pushing any commit re-enables it.
#
# HOW TO TEST IT WITHOUT WAITING A MONTH
# Actions tab -> "Monthly menu price collection" -> "Run workflow". The
# workflow_dispatch trigger below is what puts that button there.

name: Monthly menu price collection

on:
  schedule:
    # 09:00 UTC on the 2nd of each month, which is early morning in Reno.
    #
    # The 2nd rather than the 1st on purpose: a restaurant changing prices for
    # the new month often updates its website during the 1st, and collecting a
    # day later avoids catching some menus before the change and some after,
    # which would smear one month's prices across two.
    #
    # GitHub runs scheduled jobs on a shared queue, so the real start time
    # drifts by up to an hour. For a monthly index that is immaterial.
    - cron: "0 9 2 * *"

  # Adds the "Run workflow" button for manual runs.
  workflow_dispatch:

# The job pushes a commit, which needs write access to the repository.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # A blocked site can hang on a slow DNS lookup. Twenty sites at three
    # seconds each finishes in minutes, so this ceiling only ever catches
    # something genuinely stuck.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect menu prices
        # Scraping reaches twenty independent websites, several of which will
        # refuse or have moved. Those outcomes are recorded in the scrape log
        # rather than raised, so the step succeeding means the run completed
        # and the log holds the detail.
        run: python scripts/run_scrape.py --quiet

      - name: Refresh the CPI series
        # A separate step so a BLS outage leaves the collected prices intact.
        # continue-on-error keeps a failure here off the run's overall status,
        # since the CPI is context for the index rather than an input to it.
        continue-on-error: true
        env:
          # Optional. Add a key under Settings -> Secrets -> Actions to raise
          # the daily request cap. The workflow works without one.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python scripts/fetch_cpi.py

      - name: Commit the updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu_prices.sqlite data/bls_cpi_cache.json

          # --quiet exits non-zero when there is nothing staged, which happens
          # whenever every site was blocked. That is a normal outcome, so the
          # check below ends the step cleanly instead of failing the run.
          if git diff --staged --quiet; then
            echo "No data changed this run."
            exit 0
          fi

          git commit -m "Collect menu prices for $(date -u +'%Y-%m')"
          git push

      - name: Upload the collection log
        # Kept whatever happened above, so a failed run can still be read.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log-${{ github.run_number }}
          path: data/robots_report.json
          if-no-files-found: ignore
          retention-days: 90
